services:
  pihole:
    image: pihole/pihole:latest
    container_name: pihole
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "8081:80/tcp"     # interfaz web en 8081 para no ocupar el 80 de la VM
    environment:
      TZ: ${TZ}
      # Pi-hole v6: WEBPASSWORD ya no existe; la variable es esta.
      FTLCONF_webserver_api_password: ${PIHOLE_WEB_PASSWORD}
      # Con la red bridge de Docker los clientes de la LAN se ven como
      # "no locales"; sin esto Pi-hole ignora sus consultas.
      FTLCONF_dns_listeningMode: "all"
    volumes:
      - ./etc-pihole:/etc/pihole
    restart: unless-stopped
