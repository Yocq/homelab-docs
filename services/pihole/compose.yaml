# Compose tal como está desplegado en /opt/docker/pihole/docker-compose.yml
# (la contraseña real se reemplazó por un marcador).
services:
  pihole:
    container_name: pihole
    image: pihole/pihole:latest
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      TZ: America/Santiago
      WEBPASSWORD: "<contraseña>"   # variable de v5: Pi-hole v6 la ignora (ver README)
    volumes:
      - ./etc-pihole:/etc/pihole
      - ./etc-dnsmasq.d:/etc/dnsmasq.d
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "8081:80"
    restart: unless-stopped
